<!DOCTYPE html>
<html>
<head>
<title>Smart Banking Dashboard</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">

<header>
<h1>🏦 Smart Bank</h1>
<p>Manage your account easily</p>
</header>

<div class="dashboard">

<div class="card">
<h2>Create Account</h2>
<input type="text" id="name" placeholder="Enter Name">
<input type="number" id="balance" placeholder="Initial Balance">
<button onclick="createAccount()">Create</button>
</div>

<div class="card">
<h2>Deposit</h2>
<input type="number" id="depositAmount" placeholder="Amount">
<button onclick="deposit()">Deposit</button>
</div>

<div class="card">
<h2>Withdraw</h2>
<input type="number" id="withdrawAmount" placeholder="Amount">
<button onclick="withdraw()">Withdraw</button>
</div>

<div class="card balance">
<h2>Check Balance</h2>
<button onclick="checkBalance()">Show Balance</button>
<h3 id="output"></h3>
</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
